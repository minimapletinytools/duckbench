<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Duckbench Viewer</title></head>
<body>
<header class="bar"><strong>Duckbench Viewer</strong><button id="projects">Projects</button><span id="project-name"></span><button id="open-cad">Open model…</button></header>
<main id="library" hidden>
  <div class="library-title"><h1>Projects</h1><button id="back" hidden>Back to viewer</button></div>
  <form id="create"><label for="name">New project</label><div><input id="name" maxlength="80" required placeholder="Project name"><button>Create project</button></div></form>
  <div class="actions"><button id="folder">Open folder…</button><button id="import">Import project ZIP…</button><a id="workbench-home" href="../">Workbench</a></div>
  <p id="storage"></p><h2 id="projects-heading">Recent projects</h2><ul id="recent" aria-labelledby="projects-heading"></ul>
</main>
<section id="workspace" hidden>
  <aside id="explorer" hidden><h2>Project files</h2><nav id="files" aria-label="Project files"></nav>
  <div class="actions"><button id="add">Add files…</button><button id="export">Export ZIP</button><button id="refresh">Refresh</button><button id="close">Close project</button></div>
  <a id="edit" href="../">Open in workbench</a></aside>
  <section class="document"><div class="model-bar"><strong id="model-name"></strong><button id="build-preview" hidden>Build Python preview</button></div><div id="viewport" aria-label="3D model"></div><pre id="source" hidden></pre></section>
</section>
<p id="notice" role="status"></p>
<input hidden type="file" id="zip-input" accept=".zip"><input hidden type="file" id="folder-input" webkitdirectory multiple>
<input hidden type="file" id="files-input" multiple><input hidden type="file" id="model-input" accept=".html,.step,.stp,.stl">
<script type="module" src="./workspace.js"></script>
</body></html>
